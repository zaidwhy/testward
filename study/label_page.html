<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label the flagged PRs</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1c1a; --muted: #6a665f; --line: #d9d5cb; --panel: #f2efe8;
  --accent: #1f5f8b; --accent-fg: #ffffff;
  --add-bg: #e3f1e3; --add-fg: #14501b; --del-bg: #f8e1e1; --del-fg: #7a1a1a; --hunk-fg: #6a665f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --fg: #e8e6e1; --muted: #9a968d; --line: #34363a; --panel: #1f2124;
    --accent: #6fb1dc; --accent-fg: #0d1a24;
    --add-bg: #17301b; --add-fg: #9fd9a7; --del-bg: #3a1c1c; --del-fg: #f0a8a8; --hunk-fg: #9a968d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 Georgia, "Times New Roman", serif; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.progress { color: var(--muted); font: 14px/1.4 system-ui, sans-serif; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.35rem; line-height: 1.3; margin: 8px 0 4px; overflow-wrap: anywhere; }
a { color: var(--accent); overflow-wrap: anywhere; }
.meta { color: var(--muted); font: 14px/1.5 system-ui, sans-serif; margin-bottom: 12px; }
.rubric { background: var(--panel); border-left: 3px solid var(--accent); padding: 8px 14px; margin: 12px 0; font-size: 0.95rem; }
.rubric p { margin: 4px 0; }
.description { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); padding: 10px 14px; margin: 12px 0; max-height: 18rem; overflow: auto; }
.description.empty { color: var(--muted); font-style: italic; }
.file { margin: 14px 0; border: 1px solid var(--line); }
.file-head { background: var(--panel); padding: 6px 12px; font: 13px/1.4 ui-monospace, Consolas, monospace; display: flex; gap: 10px; flex-wrap: wrap; overflow-wrap: anywhere; }
.status { color: var(--accent); font-weight: bold; }
.diff { margin: 0; overflow-x: auto; font: 13px/1.45 ui-monospace, Consolas, "Courier New", monospace; }
.diff div { white-space: pre; padding: 0 12px; min-width: max-content; }
.diff .add { background: var(--add-bg); color: var(--add-fg); }
.diff .del { background: var(--del-bg); color: var(--del-fg); }
.diff .hunk { color: var(--hunk-fg); }
.controls { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 0; margin-top: 16px; font-family: system-ui, sans-serif; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 15px system-ui, sans-serif; padding: 9px 16px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; border-radius: 3px; }
button:hover, button.chosen { background: var(--accent); color: var(--accent-fg); }
button.plain { border-color: var(--line); color: var(--muted); font-weight: 400; }
button.plain:hover { background: var(--panel); color: var(--fg); }
kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-right: 6px; opacity: 0.8; }
.row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
input[type=text] { flex: 1 1 220px; min-width: 0; font: 15px system-ui, sans-serif; padding: 7px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 3px; }
.current { font-size: 14px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
.error { color: var(--del-fg); }
.done { border: 1px solid var(--accent); padding: 18px; margin: 24px 0; }
code { font: 0.95em ui-monospace, Consolas, monospace; background: var(--panel); padding: 2px 6px; }
</style>
</head>
<body>
<main id="app"><p>Loading.</p></main>
<script>
"use strict";
var LABEL_NAMES = ["intended", "laundered", "unclear"];
var RUBRIC = [
  ["intended", "the description states the behaviour change that the old test contradicts."],
  ["laundered", "the description claims a fix or no behaviour change, and the old test encodes behaviour the description does not mention changing."],
  ["unclear", "cannot tell from the title, description and diff."]
];
var items = [];
var labels = {};
var index = 0;
var noteField = null;
var errorText = "";

function el(tag, className, text) {
  var node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function labelledCount() {
  return items.filter(function (item) { return labels[item.id]; }).length;
}

function nextUnlabelled(from) {
  for (var step = 1; step <= items.length; step++) {
    var candidate = (from + step) % items.length;
    if (!labels[items[candidate].id]) return candidate;
  }
  return -1;
}

function diffBlock(patchText) {
  var block = el("div", "diff");
  String(patchText || "").split("\n").forEach(function (line) {
    var kind = "";
    if (line.indexOf("@@") === 0) kind = "hunk";
    else if (line.charAt(0) === "+") kind = "add";
    else if (line.charAt(0) === "-") kind = "del";
    block.appendChild(el("div", kind, line === "" ? " " : line));
  });
  return block;
}

function fileBlock(path, patchInfo) {
  var box = el("section", "file");
  var head = el("div", "file-head");
  head.appendChild(el("span", "status", patchInfo ? patchInfo.status : "no patch"));
  head.appendChild(el("span", "", path));
  box.appendChild(head);
  if (patchInfo) {
    box.appendChild(diffBlock(patchInfo.patch));
  } else {
    box.appendChild(el("div", "meta", "No diff text was kept for this file."));
  }
  return box;
}

function rubricBlock() {
  var box = el("div", "rubric");
  RUBRIC.forEach(function (pair) {
    var line = el("p");
    line.appendChild(el("strong", "", pair[0] + ": "));
    line.appendChild(document.createTextNode(pair[1]));
    box.appendChild(line);
  });
  return box;
}

function render() {
  var app = document.getElementById("app");
  app.textContent = "";
  noteField = null;
  var total = items.length;
  var count = labelledCount();

  var progress = el("div", "progress");
  progress.appendChild(el("span", "", count + " of " + total + " labelled"));
  progress.appendChild(el("span", "", "PR " + (index + 1) + " of " + total));
  app.appendChild(progress);

  if (count === total) {
    var done = el("div", "done");
    done.appendChild(el("p", "", "All " + total + " PRs are labelled. Close this tab, stop the server, then run:"));
    done.appendChild(el("code", "", "python study/agreement.py"));
    app.appendChild(done);
  }

  var item = items[index];
  var saved = labels[item.id];

  app.appendChild(el("h1", "", item.title || "(no title)"));
  var meta = el("div", "meta");
  var link = el("a", "", item.url);
  link.href = item.url;
  link.target = "_blank";
  link.rel = "noreferrer";
  meta.appendChild(link);
  meta.appendChild(document.createElement("br"));
  meta.appendChild(document.createTextNode(
    "author: " + (item.author || "unknown") + "  |  merged by: " + (item.merged_by || "unknown") +
    "  |  " + item.changed_files + " changed files"));
  app.appendChild(meta);

  app.appendChild(rubricBlock());

  var body = item.body ? item.body : "(empty description)";
  app.appendChild(el("div", item.body ? "description" : "description empty", body));

  var patches = item.patches || {};
  var flagged = item.flagged_files || [];
  flagged.forEach(function (path) {
    app.appendChild(fileBlock(path, patches[path]));
  });
  // A renamed test is flagged under its old path while its diff is stored under the new one.
  Object.keys(patches).forEach(function (path) {
    if (flagged.indexOf(path) === -1) app.appendChild(fileBlock(path, patches[path]));
  });

  var controls = el("div", "controls");
  var buttons = el("div", "buttons");
  LABEL_NAMES.forEach(function (name, position) {
    var button = el("button", saved && saved.label === name ? "chosen" : "");
    button.type = "button";
    button.appendChild(el("kbd", "", String(position + 1)));
    button.appendChild(document.createTextNode(name.charAt(0).toUpperCase() + name.slice(1)));
    button.addEventListener("click", function () { save(name); });
    buttons.appendChild(button);
  });
  controls.appendChild(buttons);

  var row = el("div", "row");
  noteField = el("input");
  noteField.type = "text";
  noteField.maxLength = 500;
  noteField.placeholder = "Optional one-line note";
  noteField.value = saved ? saved.note || "" : "";
  noteField.setAttribute("aria-label", "Note");
  row.appendChild(noteField);
  var prev = el("button", "plain");
  prev.type = "button";
  prev.appendChild(el("kbd", "", "k"));
  prev.appendChild(document.createTextNode("Previous"));
  prev.addEventListener("click", function () { go(-1); });
  var next = el("button", "plain");
  next.type = "button";
  next.appendChild(el("kbd", "", "j"));
  next.appendChild(document.createTextNode("Next"));
  next.addEventListener("click", function () { go(1); });
  row.appendChild(prev);
  row.appendChild(next);
  controls.appendChild(row);

  var status = el("div", "current" + (errorText ? " error" : ""));
  status.textContent = errorText || (saved ? "Your label: " + saved.label : "Not labelled yet. Keys: 1 2 3 to label, arrows or k/j to move.");
  controls.appendChild(status);
  app.appendChild(controls);
  window.scrollTo(0, 0);
}

function go(step) {
  index = (index + step + items.length) % items.length;
  errorText = "";
  render();
}

function save(label) {
  var item = items[index];
  var note = noteField ? noteField.value : "";
  fetch("/api/labels", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: item.url, label: label, note: note })
  }).then(function (response) {
    return response.json().then(function (payload) { return { ok: response.ok, payload: payload }; });
  }).then(function (outcome) {
    if (!outcome.ok) {
      errorText = "Not saved: " + (outcome.payload.error || "unknown error");
      render();
      return;
    }
    labels[item.id] = outcome.payload;
    errorText = "";
    var target = nextUnlabelled(index);
    if (target >= 0) index = target;
    render();
  }).catch(function (failure) {
    errorText = "Not saved: " + failure.message;
    render();
  });
}

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "INPUT") return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key === "1") save("intended");
  else if (event.key === "2") save("laundered");
  else if (event.key === "3") save("unclear");
  else if (event.key === "ArrowLeft" || event.key === "k") go(-1);
  else if (event.key === "ArrowRight" || event.key === "j") go(1);
});

Promise.all([
  fetch("/api/items").then(function (response) { return response.json(); }),
  fetch("/api/labels").then(function (response) { return response.json(); })
]).then(function (loaded) {
  items = loaded[0];
  labels = loaded[1];
  var first = nextUnlabelled(items.length - 1);
  index = first >= 0 ? first : 0;
  render();
}).catch(function (failure) {
  var app = document.getElementById("app");
  app.textContent = "Could not load: " + failure.message;
});
</script>
</body>
</html>
