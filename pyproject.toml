[project]
name = "testward"
version = "0.1.0"
description = "Replays the base branch's tests against a change, so a test that was edited or deleted to get CI green is caught by execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zaid Ali Syed" }]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
testward = "testward.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
